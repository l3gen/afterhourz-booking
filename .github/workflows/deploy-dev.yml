name: Deploy dev

# Every merge to main: full CI -> build the image ONCE -> deploy to dev automatically.
# Dev is destroyed nightly (dev-nightly-destroy); merging or running this workflow brings it back.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-environment
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/afterhourz-gha-deploy-dev
          aws-region: ${{ vars.AWS_REGION }}
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Does this commit already have an image?
        id: exists
        run: |
          if aws ecr describe-images --repository-name afterhourz-api --image-ids imageTag=${{ steps.tag.outputs.tag }} >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
        if: steps.exists.outputs.found != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found != 'true'
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/afterhourz-api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  foundation:
    needs: build
    uses: ./.github/workflows/terraform-stack.yml
    with:
      env: dev
      stack: foundation

  api:
    needs: [build, foundation]
    uses: ./.github/workflows/terraform-stack.yml
    with:
      env: dev
      stack: api
      image_tag: ${{ needs.build.outputs.image_tag }}
      deploy_frontend: true
