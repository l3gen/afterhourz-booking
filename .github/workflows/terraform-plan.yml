name: Terraform plan

# Shows reviewers exactly what a PR would change in AWS, before anyone approves it.
on:
  pull_request:
    paths: ["infra/**", "lambdas/**", ".github/workflows/terraform-*.yml"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ matrix.env }} / ${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
        stack: [foundation, api]
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_ecr_repository_url: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/afterhourz-api
    defaults:
      run:
        working-directory: infra/stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/afterhourz-gha-plan
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false
      - name: Init
        run: terraform init -input=false -backend-config=envs/${{ matrix.env }}.backend.hcl -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Work out what is currently deployed
        id: ctx
        run: |
          TAG=$(aws ssm get-parameter --name /afterhourz/${{ matrix.env }}/image_tag --query Parameter.Value --output text 2>/dev/null || echo none)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.stack }}" = "api" ] && ! aws s3api head-object --bucket "${{ vars.TF_STATE_BUCKET }}" --key "${{ matrix.env }}/foundation.tfstate" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan (read-only, no state lock)
        id: plan
        if: steps.ctx.outputs.skip != 'true'
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan \
            -var-file=envs/${{ matrix.env }}.tfvars ${{ matrix.stack == 'api' && format('-var image_tag={0}', steps.ctx.outputs.tag) || '' }}
          terraform show -no-color tfplan > plan.txt
      - name: Comment on the PR
        if: always() && steps.ctx.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
          STACK: ${{ matrix.stack }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tfplan:${process.env.ENV_NAME}:${process.env.STACK} -->`;
            let plan = 'plan failed, see the workflow logs';
            try { plan = fs.readFileSync(`infra/stacks/${process.env.STACK}/plan.txt`, 'utf8'); } catch (e) {}
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see workflow logs';
            const body = `${marker}\n### Terraform plan: \`${process.env.ENV_NAME}\` / \`${process.env.STACK}\` (${process.env.OUTCOME})\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
