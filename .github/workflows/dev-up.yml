name: Dev up

# Morning switch: recreate the dev API stack using the last image that was deployed to dev.
# (Optional: add a `schedule:` trigger, e.g. cron "0 12 * * 1-5", to bring it up automatically on weekdays.)
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-environment
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/afterhourz-gha-plan
          aws-region: ${{ vars.AWS_REGION }}
      - id: tag
        run: |
          T=$(aws ssm get-parameter --name /afterhourz/dev/image_tag --query Parameter.Value --output text)
          echo "tag=$T" >> "$GITHUB_OUTPUT"

  up:
    needs: resolve
    uses: ./.github/workflows/terraform-stack.yml
    with:
      env: dev
      stack: api
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      deploy_frontend: false
